<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7eb">
<title>松風寮 | 寮費チェッカー</title>
<style>
  :root {
    color-scheme: light;
    --paper: #fff7eb;
    --ink: #202d26;
    --muted: #536157;
    --line: #e1ddcf;
    --surface: #fffefa;
    --pine: #215a47;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    color: var(--ink);
    background: radial-gradient(ellipse at top right, #ffead1, transparent 60%) var(--paper);
    font: 15px/1.65 "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
  }
  main { width: min(100% - 32px, 960px); margin: 0 auto; padding: clamp(24px, 6vw, 64px) 0; }
  header { margin-bottom: 24px; }
  .brand { display: inline-block; padding: 4px 12px; border-radius: 999px; background: #fbe4c9; color: #704825; font-weight: 700; }
  h1 { font-size: clamp(28px, 6vw, 46px); line-height: 1.25; margin: 10px 0; }
  h2 { font-size: 19px; margin: 2px 0 14px; }
  p { margin: 0; }
  .muted, .hint { color: var(--muted); }
  .hint { font-size: 13px; }
  .layout { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 14px; }
  .panel, .details { border: 1px solid var(--line); border-radius: 22px; background: var(--surface); }
  .panel { padding: clamp(16px, 3vw, 26px); }
  .field { margin-top: 16px; }
  .field-title { display: block; font-weight: 700; margin-bottom: 6px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  select {
    width: 100%; min-width: 0; min-height: 44px; padding: 8px;
    font: inherit; color: var(--ink); background: #f6f8f1;
    border: 1px solid #a9b6a6; border-radius: 8px;
  }
  :focus-visible { outline: 3px solid #ad671c; outline-offset: 3px; }
  .basis { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; }
  .basis label { font-size: 13px; cursor: pointer; }
  .basis-options { margin-top: 8px; }
  .receipt { position: relative; overflow: hidden; background: #edf7e9; border-color: #cbdcc7; }
  .receipt h2 { margin-bottom: 4px; }
  .total { font-size: clamp(33px, 7vw, 58px); font-weight: 800; line-height: 1.2; color: var(--pine); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .receipt dl { margin: 14px 0 0; }
  .receipt dl > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 9px 0; border-top: 1px solid #cbdcc7; }
  dt, dd { margin: 0; }
  dd { font-weight: 700; font-variant-numeric: tabular-nums; }
  .details { margin-top: 14px; padding: 13px clamp(16px, 3vw, 26px); }
  summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
  .details p, .details table, .details details { margin-top: 10px; }
  .reason { margin-top: 14px; padding: 12px 14px; background: #f6f8f1; border-radius: 12px; }
  .reason h3 { margin: 0; font-size: 15px; }
  .reason p { margin-top: 5px; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 6px 0; border-bottom: 1px solid var(--line); }
  th:last-child, td:last-child { text-align: right; }
  .particle { position: absolute; bottom: 10%; width: 7px; height: 11px; border-radius: 2px; pointer-events: none; }
  @media (max-width: 650px) { .layout { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main>
  <header>
    <p class="brand">松風寮</p>
    <h1>寮費チェッカー</h1>
    <p class="muted">何月分まで払ったかを選ぶと、次に払う金額が分かります。</p>
  </header>

  <div class="layout">
    <section class="panel" aria-labelledby="inputTitle">
      <h2 id="inputTitle">支払い状況</h2>
      <div class="field">
        <p class="field-title">最後に払った月分</p>
        <div class="pair">
          <select id="lastPaidYear" aria-label="最後に払った年"></select>
          <select id="lastPaidMonth" aria-label="最後に払った月"></select>
        </div>
      </div>
      <div class="field">
        <div class="basis">
          <p>基準月 <strong id="basisLabel"></strong></p>
          <label><input type="checkbox" id="basisManual" aria-controls="basisOptions"> 基準月を変更</label>
        </div>
        <div class="pair basis-options" id="basisOptions" hidden>
          <select id="basisYear" aria-label="基準年"></select>
          <select id="basisMonth" aria-label="基準月"></select>
        </div>
      </div>
    </section>

    <section class="panel receipt" id="receipt" aria-labelledby="resultTitle">
      <h2 id="resultTitle">次に払う金額</h2>
      <div role="status" aria-atomic="true">
        <p class="total" id="grandTotal">—</p>
        <p class="hint" id="resultNote"></p>
      </div>
      <dl id="breakdown" hidden>
        <div><dt>寮費 <span class="hint" id="feeRange"></span></dt><dd id="feesTotal"></dd></div>
        <div><dt>罰金 <span class="hint" id="arrearsRange"></span></dt><dd id="fine"></dd></div>
      </dl>
    </section>
  </div>

  <details class="details" id="calculation" hidden>
    <summary>計算の根拠を見る</summary>
    <section class="reason">
      <h3>対象期間</h3>
      <p id="feePeriod"></p>
      <p id="arrearsPeriod"></p>
      <p class="hint" id="periodNote"></p>
    </section>
    <section class="reason" id="oldReason">
      <h3>旧制度分</h3>
      <p id="oldCount"></p>
      <p class="hint" id="specialNote"></p>
      <p id="oldFineFormula"></p>
    </section>
    <section class="reason" id="newReason">
      <h3>新制度分</h3>
      <p id="newCount"></p>
      <p id="newFineFormula"></p>
    </section>
    <section class="reason">
      <h3>支払い総額の計算</h3>
      <p id="totalFormula"></p>
    </section>
    <details id="monthlyDetails">
      <summary>月ごとの寮費</summary>
      <table>
        <thead><tr><th scope="col">対象月</th><th scope="col">寮費</th></tr></thead>
        <tbody id="monthlyFees"></tbody>
      </table>
    </details>
  </details>
</main>
<script>
(() => {
  const el = (id) => document.getElementById(id);
  const formatMonth = ({y, m}) => `${y}年${m}月`;
  const money = (amount) => `${amount.toLocaleString('ja-JP')}円`;
  const monthIndex = ({y, m}) => y * 12 + m - 1;
  const startOfProposal = monthIndex({y: 2026, m: 12});

  const today = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric'
  }).formatToParts().map(({type, value}) => [type, Number(value)]));
  const current = {y: today.year, m: today.month};

  function applySpecialCount(months){
    const set = new Set(months.map(v=> `${v.y}-${v.m}`));
    const reductions = [];
    const years = [...new Set(months.map(v=> v.y))];
    for (const y of years){
      if (set.has(`${y}-2`) && set.has(`${y}-3`)) reductions.push({y, pair:[2,3], label:`${y}年2–3月分を「2で1」に圧縮`});
      if (set.has(`${y}-8`) && set.has(`${y}-9`)) reductions.push({y, pair:[8,9], label:`${y}年8–9月分を「2で1」に圧縮`});
    }
    if (set.has(`2025-5`) && set.has(`2025-6`)) reductions.push({y:2025, pair:[5,6], label:`2025年5–6月分を「2で1」に圧縮`});
    const raw = months.length;
    const eff = Math.max(0, raw - reductions.length);
    return { rawCount: raw, effCount: eff, reductions };
  }

  function calcFine(effCount){
    if (effCount <= 1) return 0;
    if (effCount <= 5) return 5000;
    if (effCount <= 11) return 10000;
    const extra = Math.floor((effCount - 12) / 12) * 5000;
    return 15000 + extra;
  }

  function feeFor(y, m){
    if (y === 2023 && m >= 1 && m <= 6) return 21000;
    if ((y === 2023 && m >= 7 && m <= 12) || (y === 2024 && m >= 1 && m <= 3)) return 19000;
    if (y > 2024 || (y === 2024 && m >= 4)) return 17000;
    return 17000;
  }

  function readMonth(prefix){
    const y = Number(el(prefix + 'Year').value);
    const m = Number(el(prefix + 'Month').value);
    return y && m ? {y, m} : null;
  }

  function populate(prefix, initial){
    const year = el(prefix + 'Year');
    const month = el(prefix + 'Month');
    year.add(new Option('年を選択', ''));
    month.add(new Option('月を選択', ''));
    for (let y = current.y + 2; y >= 2020; y--) year.add(new Option(y + '年', y));
    for (let m = 1; m <= 12; m++) month.add(new Option(m + '月', m));
    year.value = initial?.y ?? '';
    month.value = initial?.m ?? '';
  }

  function monthRange(months){
    if (!months.length) return 'なし';
    const first = formatMonth(months[0]);
    return months.length === 1 ? first + '分' : first + '〜' + formatMonth(months.at(-1)) + '分';
  }

  let celebrationKey = '';
  function celebrate(key){
    if (key === celebrationKey) return;
    celebrationKey = key;
    el('receipt').querySelectorAll('.particle').forEach((piece) => piece.remove());
    if (!key || matchMedia('(prefers-reduced-motion: reduce)').matches || !Element.prototype.animate) return;
    const receipt = el('receipt');
    const colors = ['#498565', '#d48c42', '#a1ba62'];
    for (const direction of [1, -1]){
      for (let i = 0; i < 6; i++){
        const piece = document.createElement('span');
        piece.className = 'particle';
        piece.setAttribute('aria-hidden', 'true');
        piece.style.left = direction === 1 ? '10%' : '88%';
        piece.style.background = colors[i % colors.length];
        receipt.append(piece);
        const x = direction * receipt.clientWidth * (.22 + i * .03);
        const y = -receipt.clientHeight * (.22 + (i % 3) * .12);
        const animation = piece.animate([
          {opacity: 1, transform: 'translate(0, 0)'},
          {opacity: 0, transform: `translate(${x}px, ${y}px) rotate(${direction * (i + 1) * 65}deg)`}
        ], {duration: 700 + i * 30, easing: 'ease-out'});
        animation.onfinish = () => piece.remove();
      }
    }
  }

  function render(){
    const manual = el('basisManual').checked;
    const basis = manual ? readMonth('basis') : current;
    const paid = readMonth('lastPaid');
    el('basisOptions').hidden = !manual;
    el('basisLabel').textContent = basis ? formatMonth(basis) : '未選択';
    el('calculation').hidden = true;
    el('breakdown').hidden = true;

    let message = '';
    if (!basis) message = '基準年と基準月を選んでください。';
    else if (!paid) message = '最後に払った年と月を選んでください。';

    if (message){
      el('grandTotal').textContent = '—';
      el('resultNote').textContent = message;
      celebrate('');
      return;
    }

    const months = [];
    for (let index = monthIndex(paid) + 1; index <= monthIndex(basis); index++){
      months.push({y: Math.floor(index / 12), m: index % 12 + 1});
    }
    const arrears = months.slice(0, -1);
    const proposal = monthIndex(basis) >= startOfProposal;
    const transition = proposal && arrears.some((month) => monthIndex(month) < startOfProposal);
    const chargeableMonths = proposal
      ? arrears.slice(0, -1).filter((month) => monthIndex(month) >= startOfProposal)
      : [];
    const usesOldRules = !proposal || transition;
    const old = usesOldRules ? applySpecialCount(arrears) : {effCount: 0, reductions: []};
    const oldFine = calcFine(old.effCount);
    const addedMonths = chargeableMonths.length;
    const newFine = addedMonths * 3000;
    const fine = oldFine + newFine;
    const fees = months.reduce((sum, {y, m}) => sum + feeFor(y, m), 0);

    el('grandTotal').textContent = money(fees + fine);
    el('resultNote').textContent = months.length
      ? `寮費 ${months.length}か月分・滞納 ${arrears.length}か月`
      : '基準月分まで支払い済みです。';
    el('breakdown').hidden = false;
    el('feeRange').textContent = monthRange(months);
    el('arrearsRange').textContent = arrears.length ? monthRange(arrears) : '滞納なし';
    el('feesTotal').textContent = money(fees);
    el('fine').textContent = money(fine);

    el('feePeriod').textContent = `寮費の対象：${monthRange(months)}（${months.length}か月分）`;
    el('arrearsPeriod').textContent = `滞納期間：${monthRange(arrears)}（${arrears.length}か月）`;
    el('periodNote').textContent = proposal
      ? '基準月分は寮費に含みます。新制度分の3,000円は基準月分とその前月分には加算しません。'
      : '基準月分は寮費に含みます。罰金は前月分までの未払いで計算します。';
    el('oldReason').hidden = !usesOldRules;
    el('oldCount').textContent = proposal
      ? `2026年11月以前の未払いがあるため、滞納期間全体を旧制度でも数えます。${arrears.length}か月 − 特例${old.reductions.length}組 ＝ ${old.effCount}か月。`
      : `滞納${arrears.length}か月 − 特例${old.reductions.length}組 ＝ ${old.effCount}か月。`;
    const specials = old.reductions.map(({y, pair}) => `${y}年${pair.join('・')}月分`).join('、');
    el('specialNote').textContent = specials ? `2か月分を1か月と数えた組み合わせ：${specials}` : '適用された特例はありません。';
    const oldBandStart = Math.floor(old.effCount / 12) * 12;
    let oldBand = '0〜1か月';
    if (old.effCount >= 12) oldBand = `${oldBandStart}〜${oldBandStart + 11}か月`;
    else if (old.effCount >= 6) oldBand = '6〜11か月';
    else if (old.effCount >= 2) oldBand = '2〜5か月';
    el('oldFineFormula').textContent = `特例適用後は「${oldBand}」の段階にあたり、旧制度分は${money(oldFine)}です。`;
    el('newReason').hidden = !proposal;
    el('newCount').textContent = `2026年12月分以降の加算対象：${monthRange(chargeableMonths)}（${addedMonths}か月）`;
    el('newFineFormula').textContent = `${addedMonths}か月 × 3,000円 ＝ ${money(newFine)}`;
    const fineBreakdown = proposal && usesOldRules
      ? `（旧制度分${money(oldFine)} ＋ 新制度分${money(newFine)}）`
      : '';
    el('totalFormula').textContent = `寮費${money(fees)} ＋ 罰金${money(fine)}${fineBreakdown} ＝ ${money(fees + fine)}`;
    el('monthlyDetails').hidden = !months.length;
    el('monthlyFees').innerHTML = months.map(({y, m}) =>
      `<tr><td>${formatMonth({y, m})}分</td><td>${money(feeFor(y, m))}</td></tr>`
    ).join('');
    el('calculation').hidden = false;
    celebrate(fees + fine === 0 ? `${monthIndex(paid)}:${monthIndex(basis)}` : '');
  }

  populate('lastPaid');
  populate('basis', current);
  document.querySelectorAll('select, #basisManual').forEach((control) => control.addEventListener('change', render));
  render();
})();
</script>
</body>
</html>
